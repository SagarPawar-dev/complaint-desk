<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Complaint Desk</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>Complaint Desk</h2>
      </div>

      <div class="sidebar-section-title">WORKSPACE</div>

      <nav class="sidebar-nav">
        <!-- Dashboard -->
        <a href="dashboard.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          </svg>
          <span>Dashboard</span>
        </a>

        <!-- Complaints -->
        <a href="complaints.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <line x1="10" y1="9" x2="8" y2="9"></line>
          </svg>
          <span>Complaints</span>
        </a>

        <!-- Notifications (Active) -->
        <a href="notifications.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span>Notifications</span>
        </a>

        <!-- Settings -->
        <a href="settings.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </a>
      </nav>

      <!-- Bottom Logout -->
      <div class="sidebar-footer">
        <button type="button" class="btn-logout" onclick="sessionStorage.clear(); window.location.href='../login.html';">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Top Navigation Header -->
      <header class="top-header">
        <div class="header-title-block">
          <h1>Notifications</h1>
          <p>Recent updates on your reported complaints</p>
        </div>

        <div class="header-actions">
          <!-- Notification Bell -->
          <button class="notification-bell-btn" title="Notifications" onclick="window.location.href='notifications.html';">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-badge">2</span>
          </button>

          <!-- User Profile Capsule -->
          <div class="user-profile-capsule" title="Student Profile" onclick="window.location.href='settings.html';" style="cursor: pointer;">
            <div class="avatar-circle">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="user-info">
              <span class="user-name">Om</span>
              <span class="user-role">STUDENT</span>
            </div>
            <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </header>

      <!-- Page Content Area -->
      <main class="page-content">
        <section class="section-card" style="max-width: 800px;">
          <div class="section-card-header">
            <h2>Notification Feed</h2>
            <p style="font-size:12px; color:#64748b; margin-top:2px;">Click any notification to open its complaint details</p>
          </div>

          <div id="notificationsContainer">
            <!-- Dynamically populated from ComplaintStore -->
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/shared-data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      let studentEmail = "student@test.com";
      try {
        const demoUser = JSON.parse(sessionStorage.getItem("demoUser"));
        if (demoUser && demoUser.email) studentEmail = demoUser.email;
      } catch (e) {}

      const notifs = ComplaintStore.getNotifications("STUDENT", studentEmail);
      const container = document.getElementById("notificationsContainer");
      container.innerHTML = "";

      // Header badge
      const badge = document.querySelector(".notification-badge");
      if (badge) {
        badge.textContent = notifs.length;
        if (notifs.length === 0) badge.style.display = "none";
      }

      if (notifs.length === 0) {
        container.innerHTML = '<p style="color:#64748b; padding:20px 0;">You have no notifications right now.</p>';
        return;
      }

      notifs.forEach(n => {
        let iconColor = "blue";
        if (n.type === "RESOLVED" || n.type === "CLOSED") iconColor = "green";
        else if (n.type === "NEW_SUBMISSION" || n.type === "PENDING") iconColor = "orange";

        const card = document.createElement("div");
        card.className = "notification-card-item";
        card.style.cursor = "pointer";
        card.title = `Click to open ${n.complaintId || 'complaint'}`;
        card.innerHTML = `
          <div class="notification-icon-wrap ${iconColor}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </div>
          <div class="notification-content" style="flex:1;">
            <h4>${n.title}</h4>
            <p>${n.message}</p>
            <span class="time-stamp">${n.time} &bull; <span style="color:var(--color-primary); font-weight:600;">View Details &rarr;</span></span>
          </div>
        `;

        card.addEventListener("click", () => {
          if (n.complaintId) {
            window.location.href = `complaint-details.html?id=${n.complaintId}`;
          }
        });

        container.appendChild(card);
      });
    });
  </script>
</body>
</html>
