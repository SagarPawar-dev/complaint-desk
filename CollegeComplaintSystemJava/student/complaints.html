<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Complaints - Complaint Desk</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>Complaint Desk</h2>
      </div>

      <div class="sidebar-section-title">WORKSPACE</div>

      <nav class="sidebar-nav">
        <!-- Dashboard -->
        <a href="dashboard.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          </svg>
          <span>Dashboard</span>
        </a>

        <!-- Complaints (Active) -->
        <a href="complaints.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <line x1="10" y1="9" x2="8" y2="9"></line>
          </svg>
          <span>Complaints</span>
        </a>

        <!-- Notifications -->
        <a href="notifications.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span>Notifications</span>
        </a>

        <!-- Settings -->
        <a href="settings.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </a>
      </nav>

      <!-- Bottom Logout -->
      <div class="sidebar-footer">
        <button type="button" class="btn-logout" onclick="ComplaintStore.logout();">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Top Navigation Header -->
      <header class="top-header">
        <div class="header-title-block">
          <h1>Complaints</h1>
          <p>View and track all your submitted complaints</p>
        </div>

        <div class="header-actions">
          <!-- Notification Bell -->
          <button class="notification-bell-btn" title="Notifications" onclick="window.location.href='notifications.html';">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-badge" style="display: none;">0</span>
          </button>

          <!-- User Profile Capsule -->
          <div class="user-profile-capsule" title="Student Profile" onclick="window.location.href='settings.html';" style="cursor: pointer;">
            <div class="avatar-circle">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="user-info">
              <span class="user-name">Om</span>
              <span class="user-role">STUDENT</span>
            </div>
            <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </header>

      <!-- Page Content Area -->
      <main class="page-content">
        <!-- Complaints Table Card -->
        <section class="section-card">
          <!-- Filter & Search Bar -->
          <div class="filter-bar">
            <div class="filter-group">
              <input type="text" id="searchInput" class="search-input" placeholder="Search by title, location or ID...">
              <select id="statusFilter" class="filter-select">
                <option value="">All Statuses</option>
                <option value="PENDING">Pending / Submitted</option>
                <option value="IN PROGRESS">In Progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="CLOSED">Closed</option>
              </select>
              <select id="categoryFilter" class="filter-select">
                <option value="">All Categories</option>
                <option value="Electrical">Electrical</option>
                <option value="IT / Equipment">IT & Classroom Equipment</option>
                <option value="Infrastructure">Infrastructure</option>
                <option value="Hostel">Hostel</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <!-- Data Table -->
          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>COMPLAINT ID</th>
                  <th>TITLE</th>
                  <th>CATEGORY</th>
                  <th>PRIORITY</th>
                  <th>DATE</th>
                  <th>STATUS</th>
                  <th>ACTION</th>
                </tr>
              </thead>
              <tbody id="complaintsTableBody">
                <!-- Dynamically populated from ComplaintStore -->
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/shared-data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      let studentEmail = "student@test.com";
      try {
        const demoUser = JSON.parse(sessionStorage.getItem("demoUser"));
        if (demoUser && demoUser.email) {
          studentEmail = demoUser.email;
        }
      } catch (e) {}

      // Update Notification Badge
      ComplaintStore.updateBellBadge();

      const tableBody = document.getElementById("complaintsTableBody");
      const searchInput = document.getElementById("searchInput");
      const statusFilter = document.getElementById("statusFilter");
      const categoryFilter = document.getElementById("categoryFilter");

      let complaintsData = [];

      async function loadComplaints() {
        try {
          complaintsData = await ComplaintStore.getStudentComplaints(studentEmail);
          renderComplaints();
        } catch (err) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="7" style="text-align:center; color:#ef4444; padding:28px 16px;">
                Unable to load complaints from server. Please refresh or check connection.
              </td>
            </tr>
          `;
        }
      }

      function renderComplaints() {
        const all = complaintsData || [];
        const query = searchInput.value.toLowerCase().trim();
        const selStatus = statusFilter.value;
        const selCategory = categoryFilter.value;

        const filtered = all.filter(c => {
          const matchQuery = !query || 
            c.id.toLowerCase().includes(query) || 
            c.title.toLowerCase().includes(query) || 
            (c.location && c.location.toLowerCase().includes(query));

          const matchStatus = !selStatus || 
            (selStatus === "PENDING" && (c.status === "PENDING" || c.status === "SUBMITTED")) ||
            (selStatus === "IN PROGRESS" && (c.status === "IN PROGRESS" || c.status === "IN_PROGRESS")) ||
            (selStatus === "RESOLVED" && (c.status === "RESOLVED" || c.status === "CLOSED")) ||
            (c.status === selStatus);

          const matchCategory = !selCategory || c.category === selCategory;

          return matchQuery && matchStatus && matchCategory;
        });

        tableBody.innerHTML = "";

        if (filtered.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="7" style="text-align:center; color:#64748b; padding:28px 16px;">
                No complaints found matching your criteria.
              </td>
            </tr>
          `;
          return;
        }

        filtered.forEach(c => {
          let badgeClass = "badge-submitted";
          if (c.status === "RESOLVED" || c.status === "CLOSED") {
            badgeClass = "badge-closed";
          } else if (c.status === "IN PROGRESS" || c.status === "IN_PROGRESS") {
            badgeClass = "badge-in-progress";
          }

          let prioClass = "priority-medium";
          const pLower = (c.priority || "").toLowerCase();
          if (pLower === "low") prioClass = "priority-low";
          else if (pLower === "high") prioClass = "priority-high";
          else if (pLower === "urgent") prioClass = "priority-urgent";

          const tr = document.createElement("tr");
          tr.style.cursor = "pointer";
          tr.innerHTML = `
            <td><span class="complaint-id-tag">${c.id}</span></td>
            <td><strong>${c.title}</strong><div style="font-size:12px; color:#64748b;">${c.location || ''}</div></td>
            <td>${c.category}</td>
            <td><span class="badge-priority ${prioClass}">${c.priority || 'Medium'}</span></td>
            <td>${c.submittedAt}</td>
            <td><span class="status-badge ${badgeClass}">${c.status}</span></td>
            <td><a href="complaint-details.html?id=${c.id}" class="btn-sm-action">View Details &rarr;</a></td>
          `;

          // Clicking the row opens details
          tr.addEventListener("click", (e) => {
            if (e.target.tagName !== "A" && e.target.tagName !== "BUTTON") {
              window.location.href = `complaint-details.html?id=${c.id}`;
            }
          });

          tableBody.appendChild(tr);
        });
      }

      searchInput.addEventListener("input", renderComplaints);
      statusFilter.addEventListener("change", renderComplaints);
      categoryFilter.addEventListener("change", renderComplaints);

      loadComplaints();
    });
  </script>
</body>
</html>
