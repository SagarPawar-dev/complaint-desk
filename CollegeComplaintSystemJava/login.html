<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Complaint Desk</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-header">
    <h1>Complaint Desk</h1>
    <p>Login to manage complaints</p>
  </div>

  <div class="auth-card">
    <div id="loginError" class="auth-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">EMAIL</label>
        <input type="email" id="email" name="email" class="form-control" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-primary" id="btnSignIn">Sign In</button>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const btnSignIn = document.getElementById("btnSignIn");

    loginForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      loginError.style.display = "none";

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      btnSignIn.disabled = true;
      btnSignIn.textContent = "Signing In...";

      try {
        // Send authentication request to Java Servlet
        const response = await fetch("api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "Accept": "application/json"
          },
          body: new URLSearchParams({
            email: email,
            password: password
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Store session info locally for UI header/name rendering
          sessionStorage.setItem("demoUser", JSON.stringify({
            id: data.id,
            email: data.email,
            role: data.role,
            name: data.name,
            department: data.department
          }));

          // Redirect to authorized workspace
          window.location.href = data.redirectUrl;
        } else {
          loginError.textContent = data.message || "Invalid email or password.";
          loginError.style.display = "block";
          btnSignIn.disabled = false;
          btnSignIn.textContent = "Sign In";
        }
      } catch (err) {
        console.error("Backend login error:", err);
        loginError.textContent = "Unable to connect to the backend server. Please verify your connection or server status.";
        loginError.style.display = "block";
        btnSignIn.disabled = false;
        btnSignIn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
